<!doctype html>
<html lang="bg" data-lang-default="{{ lang_default }}" data-ccy="{{ ccy }}" data-tz="{{ tz_name }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PV система{% endblock %}{% if site_name %} · {{ site_name }}{% endif %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/i18n-en.js"></script>
  <script src="/static/i18n.js"></script>
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='6' fill='%23eda100'/%3E%3C/svg%3E">
</head>
<body data-page="{{ active }}" data-first="{{ first_day }}" data-last="{{ last_day }}" data-default-period="{{ default_period }}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M6 10v4M10 10v4"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 21h18M6 17v-6M11 17V5M16 17v-9M21 17v-3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
  </defs>
</svg>
<a class="skip" href="#main">Към съдържанието</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Навигация">
    <a class="brand" href="/">
      <span class="logo" aria-hidden="true"><svg><use href="#i-sun"/></svg></span>
      <span><b>PV система</b><small>{{ brand_line }}</small></span>
    </a>
    <nav class="pages" aria-label="Страници">
      {% for group, items in nav %}
      <div class="nav-group">
        <div class="nav-title">{{ group }}</div>
        {% for key, href, label, icon in items %}
        <a href="{{ href }}" data-nav="{{ key }}" {% if key == active %}class="active" aria-current="page"{% endif %}>
          <svg aria-hidden="true"><use href="#i-{{ icon }}"/></svg><span>{{ label }}</span></a>
        {% endfor %}
      </div>
      {% endfor %}
    </nav>
    <div class="side-foot">
      <div class="live" data-live role="status" aria-live="polite"><span class="dot"></span><span class="live-text">данни…</span></div>
      <a class="sys-alert" data-sys href="/quality" hidden><svg aria-hidden="true"><use href="#i-shield"/></svg><span class="sys-text"></span></a>
      <button class="theme-toggle" type="button" id="lang-toggle"><svg aria-hidden="true"><use href="#i-globe"/></svg><span>English</span></button>
      <button class="theme-toggle" type="button" id="theme-toggle"><svg aria-hidden="true"><use href="#i-moon"/></svg><span>Тема</span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="content">
    <header class="topbar">
      <button type="button" class="icon-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Меню">
        <svg aria-hidden="true"><use href="#i-menu"/></svg></button>
      <a class="brand mini" href="/"><span class="logo" aria-hidden="true"><svg><use href="#i-sun"/></svg></span><b>PV система</b></a>
      <div class="live" data-live><span class="dot"></span><span class="live-text"></span></div>
    </header>
    <main id="main" tabindex="-1">
      {% block filters %}
      <div class="filters" id="filters">
        <div class="presets" role="group" aria-label="Период">
          <button type="button" data-preset="today">Днес</button>
          <button type="button" data-preset="7d">7 дни</button>
          <button type="button" data-preset="30d">30 дни</button>
          <button type="button" data-preset="month">Този месец</button>
          <button type="button" data-preset="year">Тази година</button>
          <button type="button" data-preset="all">От пускането</button>
        </div>
        <div class="dates">
          <label>от <input type="date" id="from" min="{{ first_day }}" max="{{ last_day }}"></label>
          <label>до <input type="date" id="to" min="{{ first_day }}" max="{{ last_day }}"></label>
          {% block day_filter %}{% endblock %}
        </div>
        <span class="range-note" id="range-note"></span>
      </div>
      {% endblock %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="/static/echarts.min.js"></script>
<script src="/static/kpi-info.js"></script>
<script src="/static/app.js"></script>
<script>{% block script %}{% endblock %}</script>
</body>
</html>
